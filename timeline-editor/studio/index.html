<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NarrativeOS Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23141416%22/%3E%3Cpath d=%22M9 23V9h3.2l7.6 9.4V9H23v14h-3.2L12.2 13.6V23z%22 fill=%22%23ff8a4c%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;650&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="ambient" width="48" height="27" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<div class="app" id="app">
  <!-- ─────────────────────────────── top bar -->
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="emberGrad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff6a2b"/><stop offset="1" stop-color="#ffc07a"/></linearGradient></defs>
        <rect x="1" y="1" width="30" height="30" rx="8" fill="#151517" stroke="rgba(255,255,255,.08)"/>
        <path d="M9 23V9h3.2l7.6 9.4V9H23v14h-3.2L12.2 13.6V23z" fill="url(#emberGrad)"/>
      </svg>
      <span class="word">NarrativeOS</span><span class="tag">Studio</span>
    </div>
    <span class="vsep"></span>
    <label class="project" title="Switch project">
      <span class="pname" id="pname">—</span>
      <svg viewBox="0 0 16 16" class="chev" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <select id="projectSel" aria-label="Project"></select>
    </label>
    <span class="pmeta" id="pmeta"></span>
    <nav class="rail" id="rail" aria-label="Production stages"></nav>
    <div class="top-right">
      <button class="cmdk" id="cmdkBtn" title="Ask the Director (Ctrl/⌘ K)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l1.5 3.9 3.9 1.5-3.9 1.5L8 12.6 6.5 8.7 2.6 7.2l3.9-1.5z" fill="currentColor"/></svg>
        Ask the Director <kbd>Ctrl K</kbd>
      </button>
      <div class="live" id="live"><span class="beat"></span><span id="liveText">Connecting</span></div>
    </div>
  </header>

  <!-- ─────────────────────────────── left: pipeline / media / history -->
  <aside class="left panel">
    <div class="seg" role="tablist">
      <button class="on" data-ltab="pipeline">Pipeline</button>
      <button data-ltab="media">Media</button>
      <button data-ltab="history">History</button>
    </div>
    <div class="left-body" id="leftBody"></div>
    <div class="activity">
      <div class="sec-h"><span>Activity</span><span class="dim" id="actCount"></span></div>
      <div class="feed" id="feed"></div>
    </div>
  </aside>

  <!-- ─────────────────────────────── stage: viewer, transport, shots -->
  <main class="stage">
    <div class="viewer" id="viewer">
      <div class="frame" id="frame">
        <div class="screen" id="screen"></div>
        <div class="hud tl" id="hudShot"></div>
        <div class="hud tr" id="hudState"></div>
        <div class="render-ovl" id="renderOvl" hidden></div>
      </div>
    </div>
    <div class="transport">
      <button class="ibtn" id="prevShot" title="Previous shot (↑)"><svg viewBox="0 0 16 16"><path d="M4 3v10M13 3L6 8l7 5z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
      <button class="play" id="playBtn" title="Play / pause (Space)"><svg viewBox="0 0 16 16" id="playIcon"><path d="M5 3l8 5-8 5z" fill="currentColor"/></svg></button>
      <button class="ibtn" id="nextShot" title="Next shot (↓)"><svg viewBox="0 0 16 16"><path d="M12 3v10M3 3l7 5-7 5z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
      <div class="tc"><span id="tcNow">00:00.0</span><span class="dim"> / </span><span class="dim" id="tcTotal">00:00.0</span></div>
      <div class="scrub" id="scrub"><div class="cuts" id="scrubCuts"></div><i id="scrubFill"></i><b id="scrubKnob"></b></div>
      <button class="btn ghost" id="renderBtn" title="Render a fresh preview of the current timeline">
        <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Render
      </button>
    </div>
    <div class="shots" id="shots"></div>
  </main>

  <!-- ─────────────────────────────── director (agent) -->
  <aside class="director panel">
    <div class="d-head">
      <div class="orb" id="orb"><i></i><b></b></div>
      <div class="d-title">
        <div class="name">Director</div>
        <div class="status" id="dStatus">Ready</div>
      </div>
      <button class="ibtn" id="clearChat" title="Clear this conversation"><svg viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="focus" id="focus"></div>
    <div class="feedwrap"><div class="msgs" id="msgs"></div></div>
    <div class="composer">
      <div class="chips" id="chips"></div>
      <div class="box" id="composerBox">
        <textarea id="prompt" rows="1" placeholder="Tell the Director what to change…"></textarea>
        <div class="box-foot">
          <span class="selpill" id="selpill"></span>
          <span class="hint">Enter to send · Shift+Enter for a new line</span>
          <button class="send" id="send" title="Send (Enter)"><svg viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>
    </div>
  </aside>

  <!-- ─────────────────────────────── timeline -->
  <section class="timeline panel" id="timeline">
    <div class="resize" id="resize" title="Drag to resize"></div>
    <div class="tl-bar">
      <span class="tl-title">Timeline</span>
      <span class="pill" id="tlSource"></span>
      <span class="ghost-legend" id="ghostLegend" hidden><i></i>Proposed cut shown as outlines</span>
      <span class="grow"></span>
      <span class="hover-tc" id="hoverTc"></span>
      <button class="btn ghost sm" id="undoBtn" title="Undo the last applied edit (Ctrl/⌘ Z)"><svg viewBox="0 0 16 16"><path d="M5.5 3.5L2.5 6.5l3 3M3 6.5h6.5a4 4 0 0 1 0 8H7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Undo</button>
      <button class="btn ghost sm" id="fitBtn" title="Fit the whole edit"><svg viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Fit</button>
      <div class="zoom"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><input type="range" id="zoom" min="4" max="220" value="40" aria-label="Zoom"></div>
    </div>
    <div class="tl-body">
      <div class="heads" id="heads"></div>
      <div class="lanes" id="lanes"><div class="inner" id="inner"></div></div>
    </div>
    <div class="scrubpop" id="scrubpop" hidden><img alt=""><span></span></div>
  </section>
</div>

<!-- ─────────────────────────────── command palette -->
<div class="palette" id="palette" hidden>
  <div class="pal-card" role="dialog" aria-label="Ask the Director">
    <div class="pal-in">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l1.5 3.9 3.9 1.5-3.9 1.5L8 12.6 6.5 8.7 2.6 7.2l3.9-1.5z" fill="currentColor"/></svg>
      <input id="palInput" placeholder="What should change? Or jump, render, undo…" autocomplete="off">
      <span class="selpill" id="palSel"></span>
    </div>
    <div class="pal-list" id="palList"></div>
    <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> choose</span><span><kbd>Enter</kbd> run</span><span><kbd>Esc</kbd> close</span></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
